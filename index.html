<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>経費ABC判定</title>
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<style>
:root{
  --ground:#EEF1EC; --surface:#FFFFFF; --ink:#18211C; --muted:#5F6B64; --line:#D5DBD3;
  --a:#2E7D4F; --a-soft:#DDEFE3; --b:#B5402E; --b-soft:#F6DED8; --c:#A8730F; --c-soft:#F8EBC8;
  --on:#FFFFFF; --focus:#1F5FBF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121714; --surface:#1C2420; --ink:#ECF1ED; --muted:#9BA8A0; --line:#33403A;
    --a:#3E9A64; --a-soft:#1E3A2A; --b:#D05A47; --b-soft:#44231D; --c:#C99324; --c-soft:#3F3314;
    --on:#FFFFFF; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --ground:#121714; --surface:#1C2420; --ink:#ECF1ED; --muted:#9BA8A0; --line:#33403A;
  --a:#3E9A64; --a-soft:#1E3A2A; --b:#D05A47; --b-soft:#44231D; --c:#C99324; --c-soft:#3F3314;
  --on:#FFFFFF; --focus:#7FB0FF;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column;gap:10px;padding-block:10px}

/* 合言葉 */
.lock{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lock h1{font-size:22px;margin:0}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock input{width:100%;box-sizing:border-box;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:22px;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:center}
.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:700;background:var(--ink);color:var(--ground)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.err{color:var(--b);font-weight:700;font-size:14px;min-height:1.5em}

/* 上部 */
.top{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.remain{font-size:15px;color:var(--muted)}
.remain b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .ma{background:var(--a)} .meter .mb{background:var(--b)} .meter .mc{background:var(--c)}
.tools{display:flex;gap:8px}
.tools select{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.tools button{flex:none;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:14px}

.save{font-size:13px;font-weight:700;color:var(--a);display:flex;gap:6px;align-items:center;min-height:1.5em}
.save.ng{color:var(--on);background:var(--b);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45}
.remind{display:flex;gap:8px;align-items:stretch}
.remind button{flex:1;min-width:0;border:0;background:var(--ink);color:var(--ground);border-radius:10px;padding:10px;font-size:14px;font-weight:700;text-align:left}
.remind .x{flex:none;background:transparent;color:var(--muted);border:1.5px solid var(--line);text-align:center}

/* 1件のカード */
.card{flex:1;min-height:0;overflow:auto;background:var(--surface);border-radius:14px;border:1.5px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.card[data-j="A"]{border-color:var(--a);background:var(--a-soft)}
.card[data-j="B"]{border-color:var(--b);background:var(--b-soft)}
.card[data-j="C"]{border-color:var(--c);background:var(--c-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted)}
.chip{background:var(--ink);color:var(--ground);border-radius:6px;padding:2px 8px;font-weight:700;font-size:13px}
.no{margin-left:auto;font-variant-numeric:tabular-nums}
.tekiyo{font-size:20px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.amt{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:auto}
.amt small{font-size:16px;font-weight:600;margin-left:2px}
.now{font-size:14px;font-weight:700}
.now[data-j="A"]{color:var(--a)} .now[data-j="B"]{color:var(--b)} .now[data-j="C"]{color:var(--c)}

/* まとめて */
.bulk{display:flex;gap:8px;align-items:stretch}
.bulk button{flex:1;min-width:0;border:1.5px dashed var(--ink);background:transparent;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600;text-align:left;overflow-wrap:anywhere}
.bulk .x{flex:none;border-style:solid;border-color:var(--line);color:var(--muted);text-align:center}

/* ABC */
.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.abc button{border:0;border-radius:14px;padding:12px 4px 10px;color:var(--on);display:flex;flex-direction:column;align-items:center;gap:0;min-height:84px;justify-content:center}
.abc button b{font-size:34px;line-height:1.1}
.abc button span{font-size:13px;font-weight:700}
.abc .A{background:var(--a)} .abc .B{background:var(--b)} .abc .C{background:var(--c)}
.abc button:active{transform:scale(.97)}
.nav{display:flex;gap:10px}
.nav button{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.nav button:disabled{opacity:.4}

/* 重ねる画面 */
.sheet{position:fixed;inset:0;background:var(--ground);z-index:5;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:19px;margin:0}
.sheet .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.row .j{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:var(--on);background:var(--line)}
.row .j[data-j="A"]{background:var(--a)} .row .j[data-j="B"]{background:var(--b)} .row .j[data-j="C"]{background:var(--c)}
.row .t{font-size:14px;overflow-wrap:anywhere}
.row .t small{display:block;color:var(--muted);font-size:12px}
.row .y{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.counts div{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.counts b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet textarea{width:100%;box-sizing:border-box;min-height:120px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.sheet p{margin:0;font-size:14px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:9;max-width:90%}
@media (prefers-reduced-motion: reduce){.abc button:active{transform:none}}
</style>

<div class="app" id="app">
  <section class="lock" id="lock">
    <h1>経費ABC判定</h1>
    <p>お知らせした合言葉（数字16けた）を入れてください。ハイフンは無くても構いません。</p>
    <input id="pass" inputmode="numeric" autocomplete="off" placeholder="0000-0000-0000-0000" aria-label="合言葉">
    <div class="err" id="lockErr" role="alert"></div>
    <button class="btn" id="unlock">開く</button>
  </section>

  <div class="top" id="top" hidden>
    <div class="bar">
      <div class="remain">残り <b id="remain">0</b> 件<span id="remainOf"></span></div>
      <button class="btn ghost" id="openSend" style="padding:8px 12px;font-size:14px">途中保存・送る</button>
    </div>
    <div class="meter" aria-hidden="true"><i class="ma" id="mA"></i><i class="mb" id="mB"></i><i class="mc" id="mC"></i></div>
    <div class="save" id="saveState" role="status"></div>
    <div class="tools">
      <select id="filter" aria-label="科目でしぼる"></select>
      <button id="openList">一覧</button>
    </div>
  </div>

  <article class="card" id="card" hidden>
    <div class="meta"><span class="chip" id="cKamoku"></span><span id="cDate"></span><span id="cPay"></span><span class="no" id="cNo"></span></div>
    <div class="tekiyo" id="cTekiyo"></div>
    <div class="now" id="cNow"></div>
    <div class="amt"><span id="cAmt"></span><small>円</small></div>
  </article>

  <div class="remind" id="remind" hidden>
    <button id="remindDo"></button><button class="x" id="remindNo" aria-label="あとで">×</button>
  </div>

  <div class="bulk" id="bulk" hidden>
    <button id="bulkDo"></button><button class="x" id="bulkNo" aria-label="まとめない">×</button>
  </div>

  <div class="abc" id="abc" hidden>
    <button class="A" data-v="A"><b>A</b><span>経費</span></button>
    <button class="B" data-v="B"><b>B</b><span>経費でない</span></button>
    <button class="C" data-v="C"><b>C</b><span>要検討</span></button>
  </div>
  <div class="nav" id="nav" hidden>
    <button id="prev">← 戻る</button>
    <button id="skip">とばす →</button>
  </div>
</div>

<div class="sheet" id="listSheet" hidden>
  <div class="in">
    <div class="head"><h2 id="listTitle">一覧</h2><button class="btn ghost" id="closeList">閉じる</button></div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sheet" id="sendSheet" hidden>
  <div class="in stack">
    <div class="head"><h2>途中保存・結果を送る</h2><button class="btn ghost" id="closeSend">閉じる</button></div>
    <div class="counts"><div><b id="nA">0</b>A 経費</div><div><b id="nB">0</b>B でない</div><div><b id="nC">0</b>C 要検討</div><div><b id="nN">0</b>未判定</div></div>
    <p><b>下の文字が「保存データ」です。</b>コピーして、LINEなどでそのまま送ってください。途中でも何度でも送れます。送っておけば、スマホの中のデータが消えても、続きから再開できます。</p>
    <p id="lastSent"></p>
    <textarea id="code" readonly aria-label="結果の文字"></textarea>
    <button class="btn" id="copy">コピーする</button>
    <button class="btn ghost" id="share" hidden>共有する（LINEなど）</button>
    <p>スマホの中のデータが消えたときや、別のスマホで続けるときは、送った文字を下に貼って「読み込む」を押します。</p>
    <textarea id="restoreIn" placeholder="ここに貼り付け" aria-label="読み込む文字" style="min-height:70px"></textarea>
    <button class="btn ghost" id="restore">読み込む</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

var $ = function(id){ return document.getElementById(id); };
var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); return localStorage.getItem(k)===v; }catch(e){ return false; } }
};
var D=null, N=0, J=[], cur=0, filt=-1, hist=[], bulkCtx=null, toastT=null, saveOK=true, remindOff=0;

function b64(s){ var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function normPass(s){ return (s||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/\D/g,''); }
async function decrypt(pass){
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['decrypt']);
  var pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)}, key, b64(ENC.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(raw, silent){
  var p = normPass(raw);
  if(p.length!==16){ if(!silent) $('lockErr').textContent='数字16けたを入れてください（今 '+p.length+' けた）'; return false; }
  if(!window.crypto || !crypto.subtle){ $('lockErr').textContent='このブラウザでは開けません。SafariかChromeで開いてください。'; return false; }
  $('unlock').disabled=true; $('lockErr').textContent= silent?'':'確認しています…';
  try{
    D = await decrypt(p); store.set('abc_pass', p); start(); return true;
  }catch(e){
    if(!silent) $('lockErr').textContent='合言葉が違います。もう一度お確かめください。';
    return false;
  }finally{ $('unlock').disabled=false; }
}

/* 結果の文字： ABC1.<件数>.<連長圧縮>.<検算> */
function encode(){
  var s=J.join(''), out='', i=0;
  while(i<s.length){ var c=s[i], k=1; while(i+k<s.length && s[i+k]===c) k++; out+=c+(k>1?k:''); i+=k; }
  return 'ABC1.'+N+'.'+out+'.'+checksum(s);
}
function checksum(s){ var t=0; for(var i=0;i<s.length;i++) t=(t+(i+1)*s.charCodeAt(i))%99991; return t; }
function decode(txt){
  var m=(txt||'').replace(/\s+/g,'').match(/ABC1\.(\d+)\.([ABC\-0-9]+)\.(\d+)/);
  if(!m) return null;
  var s='', re=/([ABC\-])(\d*)/g, g;
  while((g=re.exec(m[2]))){ s+=g[1].repeat(g[2]?parseInt(g[2],10):1); }
  if(s.length!==parseInt(m[1],10) || s.length!==N || checksum(s)!==parseInt(m[3],10)) return null;
  return s.split('');
}
function judgedCount(){ var n=0; for(var i=0;i<N;i++) if(J[i]!=='-') n++; return n; }
function sentCount(){ var n=parseInt(store.get('abc_sent')||'0',10); return n>0?n:0; }
function save(){
  saveOK = store.set('abc_j', J.join('')); store.set('abc_cur', String(cur));
  showSave();
}
function showSave(){
  var el=$('saveState'), n=judgedCount();
  if(saveOK){
    var d=new Date(), t=d.getHours()+':'+('0'+d.getMinutes()).slice(-2);
    el.className='save'; el.textContent = n ? '✓ このスマホに保存ずみ（'+n+'件・'+t+'）' : '';
  }else{
    el.className='save ng';
    el.textContent='⚠ このスマホの中に保存できていません（プライベートブラウズ等）。画面を閉じると消えます。こまめに「途中保存・送る」で送ってください。';
  }
  var since = n - sentCount();
  if(since>=100 && n>=remindOff){ $('remindDo').textContent='前回送ってから'+since+'件すすみました。ここまでを送っておく（途中保存）'; $('remind').hidden=false; }
  else $('remind').hidden=true;
}
function markSent(){ store.set('abc_sent', String(judgedCount())); $('remind').hidden=true; showLastSent(); }
function showLastSent(){ var n=sentCount(); $('lastSent').textContent = n ? '前回は '+n+'件 の時点で送っています（今は '+judgedCount()+'件）。' : 'まだ一度も送っていません。'; }

function inFilter(i){ return filt<0 || D.r[i][1]===filt; }
function nextOpen(from){
  for(var k=1;k<=N;k++){ var i=(from+k)%N; if(inFilter(i) && J[i]==='-') return i; }
  return -1;
}
function yen(n){ return n.toLocaleString('ja-JP'); }
function label(v){ return v==='A'?'A 経費':v==='B'?'B 経費でない':v==='C'?'C 要検討':''; }

function render(){
  var r=D.r[cur];
  $('cKamoku').textContent=D.k[r[1]]; $('cDate').textContent=r[2]; $('cPay').textContent=D.p[r[3]];
  $('cNo').textContent='No.'+r[0]; $('cTekiyo').textContent=r[4]; $('cAmt').textContent=yen(r[6]);
  var j=J[cur]; $('card').dataset.j=j; $('cNow').dataset.j=j;
  $('cNow').textContent = j==='-' ? '' : '判定ずみ：'+label(j)+'（押し直すと変えられます）';
  $('prev').disabled = hist.length===0;
  var a=0,b=0,c=0,open=0,openF=0,totF=0;
  for(var i=0;i<N;i++){ var v=J[i]; if(v==='A')a++; else if(v==='B')b++; else if(v==='C')c++; else open++;
    if(inFilter(i)){ totF++; if(v==='-') openF++; } }
  $('remain').textContent = filt<0 ? open : openF;
  $('remainOf').textContent = filt<0 ? '（全'+N+'件）' : '（この科目'+totF+'件／全体の残り'+open+'件）';
  $('mA').style.width=(a/N*100)+'%'; $('mB').style.width=(b/N*100)+'%'; $('mC').style.width=(c/N*100)+'%';
  $('card').scrollTop=0;
}
function go(i, remember){ if(remember!==false) hist.push(cur); if(hist.length>300) hist.shift(); cur=i; hideBulk(); save(); render(); }

function judge(v){
  var r=D.r[cur]; J[cur]=v; save();
  var same=[]; if(r[5]){ for(var i=0;i<N;i++){ if(i!==cur && J[i]==='-' && D.r[i][1]===r[1] && D.r[i][5]===r[5]) same.push(i); } }
  var nx=nextOpen(cur);
  if(nx<0){ render(); toast(filt<0?'すべて判定しました。「結果を送る」を押してください':'この科目は終わりました。上で別の科目を選べます'); if(filt<0) openSend(); return; }
  go(nx);
  if(same.length){ bulkCtx={v:v,ids:same}; $('bulkDo').textContent='「'+r[5]+'」の残り'+same.length+'件も '+v+' にする'; $('bulk').hidden=false; }
}
function hideBulk(){ bulkCtx=null; $('bulk').hidden=true; }
function doBulk(){
  if(!bulkCtx) return; var n=bulkCtx.ids.length, v=bulkCtx.v;
  bulkCtx.ids.forEach(function(i){ if(J[i]==='-') J[i]=v; }); hideBulk(); save();
  if(J[cur]!=='-'){ var nx=nextOpen(cur); if(nx>=0){ cur=nx; save(); } }
  render(); toast(n+'件を '+v+' にしました');
}
function toast(t){ var el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ el.hidden=true; },2600); }

function buildFilter(){
  var sel=$('filter'); sel.innerHTML='';
  var o=document.createElement('option'); o.value='-1'; o.textContent='すべての科目'; sel.appendChild(o);
  D.k.forEach(function(name,idx){ var tot=0,open=0; for(var i=0;i<N;i++) if(D.r[i][1]===idx){ tot++; if(J[i]==='-') open++; }
    var e=document.createElement('option'); e.value=String(idx); e.textContent=name+'（残り'+open+'／'+tot+'）'; sel.appendChild(e); });
  sel.value=String(filt);
}
function openList(){
  var box=$('list'); box.innerHTML=''; var frag=document.createDocumentFragment(), target=null;
  $('listTitle').textContent = filt<0 ? '一覧（すべて）' : '一覧（'+D.k[filt]+'）';
  for(var i=0;i<N;i++){ if(!inFilter(i)) continue; var r=D.r[i];
    var b=document.createElement('button'); b.className='row'; b.dataset.i=i;
    var j=document.createElement('span'); j.className='j'; j.dataset.j=J[i]; j.textContent=J[i]==='-'?'':J[i];
    var t=document.createElement('span'); t.className='t'; t.textContent=r[4];
    var sm=document.createElement('small'); sm.textContent=r[2]+'　'+D.k[r[1]]; t.appendChild(sm);
    var y=document.createElement('span'); y.className='y'; y.textContent=yen(r[6]);
    b.appendChild(j); b.appendChild(t); b.appendChild(y); frag.appendChild(b); if(i===cur) target=b; }
  box.appendChild(frag); $('listSheet').hidden=false; if(target) target.scrollIntoView({block:'center'});
}
function openSend(){
  var a=0,b=0,c=0,n=0; J.forEach(function(v){ if(v==='A')a++; else if(v==='B')b++; else if(v==='C')c++; else n++; });
  $('nA').textContent=a; $('nB').textContent=b; $('nC').textContent=c; $('nN').textContent=n;
  $('code').value=encode(); $('share').hidden = !navigator.share; showLastSent(); $('sendSheet').hidden=false;
}
function copyCode(){
  var ta=$('code'), txt=ta.value;
  function ok(){ markSent(); toast('コピーしました。LINEなどに貼り付けて送ってください'); }
  function manual(){ ta.focus(); ta.select(); try{ ta.setSelectionRange(0,txt.length); }catch(e){} var done=false; try{ done=document.execCommand('copy'); }catch(e){} if(done) ok(); else toast('文字を長押しして「コピー」を選んでください'); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, manual); } else manual();
}

function start(){
  N=D.r.length; J=new Array(N).fill('-');
  var s=store.get('abc_j'); if(s && s.length===N && /^[ABC\-]+$/.test(s)) J=s.split('');
  var c=parseInt(store.get('abc_cur')||'',10); cur=(c>=0 && c<N)?c:0;
  if(J[cur]!=='-'){ var nx=nextOpen(cur-1<0?N-1:cur-1); if(nx>=0) cur=nx; }
  $('lock').hidden=true; ['top','card','abc','nav'].forEach(function(id){ $(id).hidden=false; });
  saveOK = store.set('abc_test', String(Date.now()));
  buildFilter(); render(); showSave();
}

$('unlock').addEventListener('click',function(){ tryUnlock($('pass').value,false); });
$('pass').addEventListener('keydown',function(e){ if(e.key==='Enter') tryUnlock($('pass').value,false); });
$('abc').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) judge(b.dataset.v); });
$('bulkDo').addEventListener('click',doBulk); $('bulkNo').addEventListener('click',hideBulk);
$('prev').addEventListener('click',function(){ if(hist.length){ var i=hist.pop(); cur=i; hideBulk(); save(); render(); } });
$('skip').addEventListener('click',function(){ var nx=nextOpen(cur); if(nx<0||nx===cur){ for(var k=1;k<=N;k++){ var i=(cur+k)%N; if(inFilter(i)){ nx=i; break; } } } if(nx>=0) go(nx); });
$('filter').addEventListener('change',function(){ filt=parseInt(this.value,10); hist=[]; if(!inFilter(cur)||J[cur]!=='-'){ var nx=nextOpen(cur); if(nx<0){ for(var i=0;i<N;i++) if(inFilter(i)){ nx=i; break; } } if(nx>=0) cur=nx; } hideBulk(); save(); render(); });
$('filter').addEventListener('focus',buildFilter);
$('openList').addEventListener('click',openList);
$('closeList').addEventListener('click',function(){ $('listSheet').hidden=true; });
$('list').addEventListener('click',function(e){ var b=e.target.closest('.row'); if(!b) return; $('listSheet').hidden=true; go(parseInt(b.dataset.i,10)); });
$('openSend').addEventListener('click',openSend);
$('remindDo').addEventListener('click',openSend);
$('remindNo').addEventListener('click',function(){ remindOff=judgedCount()+100; $('remind').hidden=true; });
$('closeSend').addEventListener('click',function(){ $('sendSheet').hidden=true; });
$('copy').addEventListener('click',copyCode);
$('share').addEventListener('click',function(){ navigator.share({text:$('code').value}).then(markSent, function(){}); });
$('restore').addEventListener('click',function(){
  var s=decode($('restoreIn').value); if(!s){ toast('読み込めません。文字が欠けていないかお確かめください'); return; }
  var have=J.filter(function(v){return v!=='-';}).length;
  if(have && !confirm('今このスマホにある判定（'+have+'件）を、貼り付けた内容に置き換えます。よろしいですか？')) return;
  J=s; hist=[]; var nx=nextOpen(N-1); cur=nx>=0?nx:0; save(); buildFilter(); render(); $('restoreIn').value=''; $('sendSheet').hidden=true; toast('読み込みました');
});

var saved=store.get('abc_pass'); if(saved){ $('pass').value=saved; tryUnlock(saved,true); }
})();
</script>
